<style>
/* Layout: one-column phone app — screen header, scrolling body, fixed bottom bar; teal ledger card as the single bold element, marigold for "today" marks and the guide spotlight */
:root{
  --paper:#F3F5F0; --card:#FFFFFF; --ink:#1B2230; --muted:#5A6373; --faint:#8A93A1; --line:#DCE1D6; --line2:#E9ECE5;
  --accent:#0D6B59; --accent-ink:#FFFFFF; --accent-soft:#E2F0EB; --accent-deep:#0A5547;
  --hero:#0D5E50; --hero-glow:#1A7C6B; --hero-ink:#F6F3E8; --hero-muted:#B9D6CD; --hero-track:#2C7A6B;
  --marigold:#E39B0B; --marigold-soft:#FFF3D6;
  --good:#1E7B40; --good-bg:#E4F3E8; --warn:#A35F00; --warn-bg:#FFF1D9; --crit:#B3261E; --crit-bg:#FCE6E3; --info:#2B5C8A; --info-bg:#E3EDF7;
  --shade:rgba(15,22,30,.55);
  --f-display:"Rozha One", "Georgia", "Times New Roman", serif;
  --f-body:"Lexend", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-lg:18px; --r-md:14px; --r-sm:10px;
  --nav-h:68px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#11161C; --card:#1A2129; --ink:#EDF0F2; --muted:#A6AFBB; --faint:#7D8794; --line:#2B3440; --line2:#232B35;
  --accent:#43B79E; --accent-ink:#06231D; --accent-soft:#16332D; --accent-deep:#6FD0BA;
  --hero:#123B34; --hero-glow:#1D5A4F; --hero-ink:#F3EFE2; --hero-muted:#9CC5BA; --hero-track:#245A50;
  --marigold:#F2B441; --marigold-soft:#3A2E14;
  --good:#5CC883; --good-bg:#16301F; --warn:#F2AE4A; --warn-bg:#3A2A10; --crit:#F27166; --crit-bg:#3D1A17; --info:#7FB2E5; --info-bg:#172A3D;
  --shade:rgba(0,0,0,.7); color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#11161C; --card:#1A2129; --ink:#EDF0F2; --muted:#A6AFBB; --faint:#7D8794; --line:#2B3440; --line2:#232B35;
  --accent:#43B79E; --accent-ink:#06231D; --accent-soft:#16332D; --accent-deep:#6FD0BA;
  --hero:#123B34; --hero-glow:#1D5A4F; --hero-ink:#F3EFE2; --hero-muted:#9CC5BA; --hero-track:#245A50;
  --marigold:#F2B441; --marigold-soft:#3A2E14;
  --good:#5CC883; --good-bg:#16301F; --warn:#F2AE4A; --warn-bg:#3A2A10; --crit:#F27166; --crit-bg:#3D1A17; --info:#7FB2E5; --info-bg:#172A3D;
  --shade:rgba(0,0,0,.7); color-scheme:dark }
html{font-size:16px; height:100%; box-sizing:border-box}
html.big{font-size:18.5px}
body{background:var(--paper); color:var(--ink); font-family:var(--f-body); font-size:1rem; line-height:1.5; height:100%; display:flex; flex-direction:column; overflow:hidden; -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent}
b,strong{font-weight:600}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--marigold); outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior-y:contain; padding-inline:max(16px, calc((100% - 528px) / 2)); padding-block:6px 36px}

/* header */
.top{position:relative; flex:none; z-index:20; background:var(--paper); border-bottom:1px solid transparent}
.top.scrolled{border-bottom-color:var(--line)}
.top-in{max-width:560px; margin:0 auto; padding:12px 16px 10px; display:flex; align-items:center; gap:10px}
.top h1{font-family:var(--f-display); font-weight:400; font-size:1.6rem; line-height:1.1; margin:0; letter-spacing:.2px; text-wrap:balance}
.top .sub{color:var(--muted); font-size:.85rem; margin-top:2px}
.top .tt{flex:1; min-width:0}
.iconbtn{width:46px; height:46px; border-radius:50%; border:1px solid var(--line); background:var(--card); display:grid; place-items:center; flex:none; font-weight:600; font-size:1.15rem}
.iconbtn.help{color:var(--accent); border-color:var(--accent)}
.iconbtn svg{width:22px; height:22px}

/* bottom nav */
.nav{position:relative; flex:none; z-index:30; background:var(--card); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:560px; margin:0 auto; display:grid; grid-template-columns:repeat(5,1fr); height:var(--nav-h); align-items:center}
.nav button{background:none; border:0; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:.72rem; color:var(--muted); padding:6px 0; position:relative; min-height:56px; justify-content:center}
.nav button svg{width:24px; height:24px}
.nav button[aria-current="page"]{color:var(--accent); font-weight:600}
.nav .add{width:62px; height:62px; border-radius:50%; background:var(--accent); color:var(--accent-ink); margin:-26px auto 0; box-shadow:0 6px 18px rgba(13,107,89,.35); border:4px solid var(--paper); justify-content:center}
.nav .add svg{width:30px; height:30px}
.nav .addwrap{display:flex; flex-direction:column; align-items:center; font-size:.72rem; color:var(--accent); font-weight:600}
.badge{position:absolute; top:2px; left:calc(50% + 6px); background:var(--crit); color:#fff; border-radius:999px; font-size:.68rem; min-width:20px; height:20px; padding:0 5px; display:grid; place-items:center; font-weight:600}

/* generic blocks */
.stack{display:flex; flex-direction:column; gap:14px}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg); padding:16px}
.card h2,.sec-h{font-size:1.05rem; margin:0 0 4px; font-weight:600}
.sec-h{margin:8px 2px 0; display:flex; align-items:baseline; justify-content:space-between; gap:8px}
.sec-h a,.linkbtn{color:var(--accent); font-weight:600; font-size:.9rem; background:none; border:0; padding:6px 0; text-decoration:none}
.muted{color:var(--muted)} .small{font-size:.85rem} .tiny{font-size:.76rem}
.row{display:flex; align-items:center; gap:12px}
.row .grow{flex:1; min-width:0}
.right{text-align:right}
.b{font-weight:600}
p{margin:0}
.lede{font-size:.95rem; color:var(--muted)}

/* hero (the ledger card) */
.hero{background:var(--hero); color:var(--hero-ink); border-radius:22px; padding:18px 18px 16px; position:relative; overflow:hidden}
.hero::after{content:""; position:absolute; inset:0; background:repeating-linear-gradient(180deg, transparent 0 31px, rgba(255,255,255,.045) 31px 32px); pointer-events:none}
.hero > *{position:relative; z-index:1}
.hero .lbl{color:var(--hero-muted); font-size:.9rem}
.hero .big{font-family:var(--f-display); font-size:clamp(2.2rem, 12vw, 3rem); line-height:1; margin:6px 0 2px; letter-spacing:.5px}
.hero .of{color:var(--hero-muted); font-size:.95rem}
.track{height:14px; background:var(--hero-track); border-radius:999px; position:relative; margin:16px 0 8px}
.track .fill{position:absolute; inset:0 auto 0 0; border-radius:999px; background:var(--hero-ink)}
.track .fill.over{background:#FF8A7A}
.track .mark{position:absolute; top:-6px; bottom:-6px; width:4px; margin-left:-2px; background:var(--marigold); border-radius:2px}
.hero .legend{display:flex; justify-content:space-between; font-size:.8rem; color:var(--hero-muted); gap:8px}
.hero .day{margin-top:12px; padding-top:12px; border-top:1px dashed rgba(255,255,255,.22); display:flex; justify-content:space-between; align-items:center; gap:10px}
.hero .day b{font-size:1.25rem}
.pill{display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:4px 10px; font-size:.82rem; font-weight:600; white-space:nowrap}
.pill.good{background:var(--good-bg); color:var(--good)} .pill.warn{background:var(--warn-bg); color:var(--warn)} .pill.crit{background:var(--crit-bg); color:var(--crit)} .pill.info{background:var(--info-bg); color:var(--info)} .pill.neutral{background:var(--line2); color:var(--muted)}
.hero .pill{background:rgba(255,255,255,.14); color:var(--hero-ink)}
.hero .pill.crit{background:#FFE1DC; color:#8E1B14} .hero .pill.warn{background:#FFE9BF; color:#6E4300} .hero .pill.good{background:#DDF3E4; color:#145A2E}

.hero{padding:16px 16px 14px; background:radial-gradient(120% 90% at 50% 0%, var(--hero-glow) 0%, var(--hero) 60%)}
.hero-top{display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap}
.hero-top .pills{display:flex; gap:6px; flex-wrap:wrap}
.gauge{position:relative; max-width:330px; margin:6px auto 0}
.gauge svg{display:block; width:100%; height:auto; overflow:visible}
.g-track{fill:none; stroke:var(--hero-track); stroke-width:18; stroke-linecap:round}
.g-fill{fill:none; stroke:var(--hero-ink); stroke-width:18; stroke-linecap:round; transition:stroke-dasharray 1.1s cubic-bezier(.2,.8,.2,1)}
.g-fill.over{stroke:#FF8A7A}
.g-mark{stroke:var(--marigold); stroke-width:6; stroke-linecap:round}
.g-center{position:absolute; left:0; right:0; bottom:0; text-align:center}
.g-center .big{margin:2px 0 0; font-size:clamp(2.1rem, 11vw, 2.9rem)}
.g-center .of{font-size:.85rem}
.g-legend{display:flex; justify-content:center; gap:16px; flex-wrap:wrap; font-size:.75rem; color:var(--hero-muted); margin-top:10px}
.g-legend span{display:inline-flex; align-items:center; gap:6px}
.sw{width:14px; height:6px; border-radius:3px; display:inline-block}
.sw-spent{background:var(--hero-ink)} .sw-mark{background:var(--marigold); width:6px; height:14px}
.hstats{display:grid; grid-template-columns:repeat(3,1fr); margin-top:14px; border-top:1px dashed rgba(255,255,255,.22); padding-top:12px; text-align:center}
.hstats > div{display:flex; flex-direction:column; gap:2px; min-width:0}
.hstats > div + div{border-left:1px solid rgba(255,255,255,.14)}
.hstats .lbl{font-size:.75rem}
.hstats b{font-size:1.08rem}
.glance{display:flex; gap:10px; overflow-x:auto; scroll-snap-type:x mandatory; margin-inline:-16px; padding:2px 16px 4px; scrollbar-width:none}
.glance::-webkit-scrollbar{display:none}
.gl{flex:0 0 auto; width:min(62%, 220px); scroll-snap-align:start; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px 14px; text-align:left; display:flex; flex-direction:column; gap:4px}
.gl .gl-h{font-size:.8rem; color:var(--muted)}
.gl b{font-size:1.2rem}
.prog.sm{height:6px; margin-top:2px}
@keyframes rise{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
.anim .hero,.anim .glance,.anim .cats{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.anim .glance{animation-delay:.08s} .anim .cats{animation-delay:.14s}
.welcome{position:fixed; inset:0; z-index:95; background:radial-gradient(120% 70% at 50% 0%, #17796A 0%, #0D5E50 45%, #093F36 100%); color:#F6F3E8; display:flex; flex-direction:column; overflow-y:auto; padding:calc(28px + env(safe-area-inset-top,0px)) 22px calc(28px + env(safe-area-inset-bottom,0px))}
.welcome .in{max-width:440px; width:100%; margin:auto; display:flex; flex-direction:column; gap:20px}
.welcome .in > *{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.welcome .in > *:nth-child(2){animation-delay:.08s} .welcome .in > *:nth-child(3){animation-delay:.16s} .welcome .in > *:nth-child(4){animation-delay:.24s} .welcome .in > *:nth-child(5){animation-delay:.32s}
.welcome .logo{width:88px; height:88px; filter:drop-shadow(0 10px 24px rgba(0,0,0,.3))}
.welcome .logo svg{width:100%; height:100%}
.welcome h2{font-family:var(--f-display); font-weight:400; font-size:2.8rem; line-height:1; margin:2px 0 0}
.w-kicker{font-size:.8rem; letter-spacing:.12em; text-transform:uppercase; color:#B9D6CD; font-weight:600}
.w-lede{font-size:1.05rem; color:#DCEBE6}
.w-lbl{color:#DCEBE6}
.welcome ul{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px}
.welcome li{display:flex; gap:12px; align-items:center; font-size:1rem}
.welcome li .ic{width:40px; height:40px; border-radius:12px; background:rgba(255,255,255,.1); display:grid; place-items:center; flex:none; font-size:1.1rem}
.welcome .btn{background:#E39B0B; color:#2A1B00; min-height:54px; font-size:1.02rem}
.welcome .btn.ghost{background:transparent; color:#F6F3E8; border:1px solid rgba(255,255,255,.3)}
.welcome .inp{background:#FFFFFF; color:#1B2230}
@media (prefers-reduced-motion: reduce){ .anim .hero,.anim .glance,.anim .cats,.welcome .in > *{animation:none} .g-fill{transition:none} }

/* categories */
.cats{padding:4px 0}
.cat{display:grid; grid-template-columns:42px 1fr auto; gap:4px 12px; align-items:center; padding:12px 16px; border:0; background:none; width:100%; text-align:left; border-bottom:1px solid var(--line2)}
.cat:last-child{border-bottom:0}
.emo{width:42px; height:42px; border-radius:12px; background:var(--accent-soft); display:grid; place-items:center; font-size:1.3rem; grid-row:span 2}
.cat .nm{font-weight:600; min-width:0}
.cat .amt{font-weight:600; text-align:right; white-space:nowrap}
.cat .meta{grid-column:2 / 4; display:flex; flex-direction:column; gap:5px}
.bar{height:8px; background:var(--line2); border-radius:999px; overflow:hidden}
.bar > i{display:block; height:100%; border-radius:999px; background:var(--good)}
.bar > i.warn{background:var(--warn)} .bar > i.crit{background:var(--crit)}
.cat .sub2{display:flex; justify-content:space-between; font-size:.8rem; color:var(--muted); gap:8px}
.st-good{color:var(--good)} .st-warn{color:var(--warn)} .st-crit{color:var(--crit)}

/* to-do cards */
.todo{display:flex; gap:12px; align-items:flex-start; border-radius:var(--r-lg); padding:14px; border:1px solid var(--line); background:var(--card)}
.todo .ic{width:40px; height:40px; border-radius:12px; display:grid; place-items:center; flex:none; font-size:1.2rem}
.todo.info .ic{background:var(--info-bg)} .todo.warn .ic{background:var(--warn-bg)} .todo.crit .ic{background:var(--crit-bg)} .todo.good .ic{background:var(--good-bg)}
.todo .tx{flex:1; min-width:0}
.todo .tx > b{display:block}
.todo .acts{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap}

/* buttons */
.btn{border:0; border-radius:12px; padding:12px 18px; font-weight:600; min-height:48px; background:var(--accent); color:var(--accent-ink); display:inline-flex; align-items:center; justify-content:center; gap:8px}
.btn.sec{background:var(--card); color:var(--accent); border:1.5px solid var(--accent)}
.btn.ghost{background:transparent; color:var(--muted); border:1px solid var(--line)}
.btn.danger{background:var(--crit-bg); color:var(--crit)}
.btn.danger.armed{background:var(--crit); color:#fff}
.btn.block{width:100%}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.btn.sm{min-height:40px; padding:8px 14px; font-size:.9rem}

/* entries list */
.day-h{font-size:.8rem; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.06em; margin:14px 4px 6px}
.ent{display:grid; grid-template-columns:40px 1fr auto; gap:2px 12px; align-items:center; width:100%; text-align:left; background:var(--card); border:0; border-bottom:1px solid var(--line2); padding:11px 14px}
.ent:first-child{border-top-left-radius:var(--r-md); border-top-right-radius:var(--r-md)}
.ent:last-child{border-bottom:0; border-bottom-left-radius:var(--r-md); border-bottom-right-radius:var(--r-md)}
.ent .emo{width:40px; height:40px; font-size:1.15rem}
.ent .t1{font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ent .t2{font-size:.8rem; color:var(--muted); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ent .am{font-weight:600; text-align:right; white-space:nowrap}
.ent .am.in{color:var(--good)}
.list{border:1px solid var(--line); border-radius:var(--r-md); overflow:hidden; background:var(--card)}
.tag{display:inline-block; font-size:.7rem; font-weight:600; padding:1px 7px; border-radius:6px; background:var(--line2); color:var(--muted); margin-left:6px; vertical-align:1px}
.tag.axis{background:var(--info-bg); color:var(--info)} .tag.em{background:var(--crit-bg); color:var(--crit)}

/* chips & inputs */
.chips{display:flex; gap:8px; flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap; overflow-x:auto; padding-bottom:4px; scrollbar-width:none}
.chip{border:1.5px solid var(--line); background:var(--card); border-radius:999px; padding:9px 14px; font-size:.92rem; white-space:nowrap; min-height:44px}
.chip[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-deep); font-weight:600}
.field{display:flex; flex-direction:column; gap:6px}

<script>
// ===== Money engine: pure functions, no DOM =====
const GROUPS = [
  { k: 'loans', e: '🏠', n: 'Home loan & EMIs', subs: ['Home loan EMI', 'Education loan interest', 'Other loan EMI', 'Loan fees & charges'] },
  { k: 'groceries', e: '🛒', n: 'Groceries & food', subs: ['Provisions', 'Vegetables', 'Milk & dairy', 'Fruits', 'Rice', 'Pickles', 'Bakery & snacks'] },
  { k: 'bills', e: '💡', n: 'Home bills & help', subs: ['Electricity', 'Cooking gas', 'Internet', 'Phone recharge', 'House maid', 'Ironing (press)', 'Watchman', 'Flat maintenance', 'House tax', 'Newspaper', 'TV & OTT', 'Cleaning', 'Gardening'] },
  { k: 'insurance', e: '🛡️', n: 'Insurance', subs: ['Health insurance', 'Life insurance', 'Vehicle insurance', 'Home insurance'] },
  { k: 'home', e: '🔧', n: 'Home repairs & items', subs: ['Household items', 'Appliances', 'Repairs', 'Water & connections'] },
  { k: 'travel', e: '🚆', n: 'Travel & trips', subs: ['Tickets', 'Auto & cab', 'Rooms & stay', 'Trip food & sightseeing'] },
  { k: 'health', e: '🩺', n: 'Health', subs: ['Doctor', 'Lab tests', 'Medicines', 'Spectacles'] },
  { k: 'children', e: '🎓', n: 'Children', subs: ['Fees', 'Pocket money', 'Other', 'Support'] },
  { k: 'vehicles', e: '🚗', n: 'Car & bike', subs: ['Car petrol', 'Bike petrol', 'Car repair & wash', 'Bike repair', 'FASTag, toll & parking', 'Pollution certificate'] },
  { k: 'shopping', e: '👕', n: 'Shopping & personal', subs: ['Clothes', 'Footwear', 'Tailor', 'Barber & parlour', 'Mobile & computer', 'Stationery', 'Fancy & other'] },
  { k: 'puja', e: '🪔', n: 'Puja & temple', subs: ['Puja items & darshan', 'Flowers', 'Astrologer', 'Temple donation'] },
  { k: 'fun', e: '🍽️', n: 'Eating out & fun', subs: ['Dining out', 'Movies & entertainment'] },
  { k: 'gifts', e: '🎁', n: 'Gifts', subs: ['Gifts', 'Cash gifts'] },
  { k: 'buffer', e: '🧰', n: 'Other / buffer', subs: ['Other'] },
];
const GKEYS = GROUPS.map(g => g.k);
const GMAP = Object.fromEntries(GROUPS.map(g => [g.k, g]));
const POT_NAMES = { ef: 'Emergency fund', loan: 'Home-loan prepayment pot', gold: 'Gold reserve', reward: 'Treat pot' };

const DEFAULT_SETTINGS = {
  v: 1, startCycle: '2026-10', practiceCycle: '2026-10', income: 0, saving: 0,
  limits: Object.fromEntries(GKEYS.map(g => [g, 0])),
  roll: { loans: 0, groceries: 0, bills: 1, insurance: 12, home: 6, travel: 6, health: 6, children: 6, vehicles: 6, shopping: 4, puja: 6, fun: 0, gifts: 3, buffer: 0 },
  rewardPct: 10, efTarget: 200000, loanShare: 0,
  loan: { balance: 0, asOf: '2026-10-07', rate: 8, emi: 1, emiDay: 7, origBalance: 0, origAsOf: '2026-10-07' },
  lender: 'the bank', gpf: 0, childSubs: null,
  birthYear: 1971, retireYear: 2031, extraPerYear: 0, axisOpening: 0, axisOpeningTs: 0, goldDipPct: 5, bills: [],
};

// ---------- dates (all local, as YYYY-MM-DD strings)
const pad = n => String(n).padStart(2, '0');
const lastDay = (y, m) => new Date(y, m, 0).getDate(); // m: 1-12
const ymd = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
function parseD(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function dateToStr(dt) { return ymd(dt.getFullYear(), dt.getMonth() + 1, dt.getDate()); }
function addDays(s, n) { const d = parseD(s); d.setDate(d.getDate() + n); return dateToStr(d); }
function diffDays(a, b) { return Math.round((parseD(b) - parseD(a)) / 864e5); }
function nextCycle(c) { const [y, m] = c.split('-').map(Number); return m === 12 ? `${y + 1}-01` : `${y}-${pad(m + 1)}`; }
function prevCycle(c) { const [y, m] = c.split('-').map(Number); return m === 1 ? `${y - 1}-12` : `${y}-${pad(m - 1)}`; }
// A budget month starts on the LAST day of the previous calendar month (salary day)
function cycleOf(ds) {
  const [y, m, d] = ds.split('-').map(Number);
  if (d >= lastDay(y, m)) return m === 12 ? `${y + 1}-01` : `${y}-${pad(m + 1)}`;
  return `${y}-${pad(m)}`;
}
function cycleRange(c) {
  const [y, m] = c.split('-').map(Number);
  const py = m === 1 ? y - 1 : y, pm = m === 1 ? 12 : m - 1;
  return { start: ymd(py, pm, lastDay(py, pm)), end: ymd(y, m, lastDay(y, m) - 1) };
}
// next date (>= from, or > from when strict) that falls on month m / day d
function nextOccurrence(m, d, from, strict) {
  let y = Number(from.slice(0, 4));
  for (let i = 0; i < 3; i++) {
    const ds = ymd(y + i, m, Math.min(d, lastDay(y + i, m)));
    if (strict ? ds > from : ds >= from) return ds;
  }
  return ymd(y + 3, m, Math.min(d, lastDay(y + 3, m)));
}

// ---------- helpers
const r2 = x => Math.round((Number(x) || 0) * 100) / 100;
function emptyPots() { return { ef: 0, loan: 0, gold: 0, reward: 0, cat: {} }; }
function clonePots(p) { const o = Object.assign(emptyPots(), JSON.parse(JSON.stringify(p || {}))); if (!o.cat) o.cat = {}; return o; }
function stableStr(v) {
  if (Array.isArray(v)) return '[' + v.map(stableStr).join(',') + ']';
  if (v && typeof v === 'object') return '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + stableStr(v[k])).join(',') + '}';
  return JSON.stringify(v === undefined ? null : v);
}
function hashStr(s) { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }

// Amount kept back (beyond the rollover cap) because a yearly bill is due within 90 days of the month end
function billReserve(set, cid) {
  const end = cycleRange(cid).end, res = {};
  for (const b of set.bills || []) {
    const due = nextOccurrence(b.m, b.d, end, true);
    if (diffDays(end, due) <= 90) res[b.g] = (res[b.g] || 0) + (+b.amt || 0);
  }
  return res;
}

/**
 * Run one budget month.
 * set: settings (limits, roll, rewardPct, efTarget, bills, practiceCycle)
 * prev: { pots, penalty } carried from the previous month's close
 * entries: this month's entries; moves: this month's money moves
 * final: true = month is over -> sweep surplus down the savings order
 */
function runCycle(cid, set, prev, entries, moves, final) {
  const limits = set.limits || {}, roll = set.roll || {};
  const pots = clonePots(prev && prev.pots);
  const penalty = (prev && prev.penalty) || {};
  const avail = {}, penaltyApplied = {};
  for (const g of GKEYS) {
    const v = +limits[g] || 0, nv = Math.max(0, v + (+penalty[g] || 0));
    penaltyApplied[g] = nv - v; avail[g] = nv;
  }
  const ev = [];
  for (const m of moves) ev.push({ d: m.d, o: m.ts || 0, m });
  for (const e of entries) if (e.k === 'e' && e.em) ev.push({ d: e.d, o: e.ts || 0, e });
  ev.sort((a, b) => (a.d < b.d ? -1 : a.d > b.d ? 1 : a.o - b.o));
  const spent = Object.fromEntries(GKEYS.map(g => [g, 0]));
  let emUsed = 0, prepaid = 0, goldBought = 0, goldGrams = 0, saved = 0, rewardUsed = 0;
  const moved = [];
  for (const x of ev) {
    if (x.m) {
      const m = x.m, amt = +m.amt || 0;
      if (m.t === 'save') { for (const [p, v] of Object.entries(m.alloc || {})) pots[p] = (pots[p] || 0) + (+v || 0); saved += amt; }
      else if (m.t === 'prepay') { if (m.fromPot !== false) pots.loan -= Math.min(amt, Math.max(0, pots.loan)); prepaid += amt; }
      else if (m.t === 'gold') { if (m.fromPot !== false) pots.gold -= Math.min(amt, Math.max(0, pots.gold)); goldBought += amt; goldGrams += +m.grams || 0; }
      else if (m.t === 'reward_use') { pots.reward -= Math.min(amt, Math.max(0, pots.reward)); rewardUsed += amt; }
      else if (m.t === 'potset') { if (m.pot === 'cat') pots.cat[m.g] = +m.value || 0; else pots[m.pot] = +m.value || 0; }
      else if (m.t === 'catmove' && avail[m.from] !== undefined && avail[m.to] !== undefined) {
        const a = Math.min(amt, avail[m.from]); avail[m.from] -= a; avail[m.to] += a; moved.push({ from: m.from, to: m.to, amt: a });
      }
    } else {
      const e = x.e, a = +e.a || 0;
      const take = Math.max(0, Math.min(a, Math.max(0, pots.ef)));
      pots.ef -= take; emUsed += take;
      if (a - take > 0 && spent[e.g] !== undefined) spent[e.g] += a - take;
    }
  }
  let extras = 0, income = 0, cardPaid = 0;
  for (const e of entries) {
    if (e.k === 'e' && !e.em && spent[e.g] !== undefined) spent[e.g] += +e.a || 0;
    else if (e.k === 'x') extras += +e.a || 0;
    else if (e.k === 'i') income += +e.a || 0;
    else if (e.k === 'c') cardPaid += +e.a || 0;
  }
  const cat = {};
  let used = 0, ceiling = 0, totalOver = 0;
  for (const g of GKEYS) {
    const s = Math.max(0, spent[g]), a = avail[g], pot = Math.max(0, +pots.cat[g] || 0);
    const fromMonth = Math.min(s, a), beyond = s - fromMonth, fromPot = Math.min(beyond, pot), over = beyond - fromPot;
    cat[g] = { limit: +limits[g] || 0, avail: a, pot, spent: s, fromMonth, fromPot, over, leftover: a - fromMonth, total: a + pot, left: a + pot - s };
    used += fromMonth + over; ceiling += a; totalOver += over;
  }
  const potsNow = clonePots(pots);
  for (const g of GKEYS) potsNow.cat[g] = cat[g].pot - cat[g].fromPot;
  const res = { cid, cat, ceiling, used, left: ceiling - used, totalOver, emUsed, prepaid, goldBought, goldGrams, saved, rewardUsed, extras, income, cardPaid, penaltyApplied, moved, potsNow };
  if (!final) return res;

  const d = D, set = d.set, cid = d.cur, L = d.live;
  if (!S.alerts.welcome) addAlert('welcome', 'info', 'Welcome to your money book', `${S.hx.length.toLocaleString('en-IN')} old entries are loaded. Tap the ? button on any screen to learn how it works.`, 'guide');
  for (const g of GKEYS) {
    const c = L.cat[g]; if (c.spent <= 0) continue;
    const st = statusOfG(g, c.spent, c.total), nm = GMAP[g].n;
    if (st === 'crit') addAlert(`c100_${cid}_${g}`, 'crit', `${nm}: limit crossed`, `Spent ${inr(c.spent)} against ${inr(c.total)}. Move money from another category, or the extra comes out of the monthly ceiling.`, 'cat:' + g);
    else if (st === 'warn') addAlert(`c80_${cid}_${g}`, 'warn', `${nm}: ${Math.round(c.spent / c.total * 100)}% used`, `Only ${inr(c.left)} left for ${d.daysLeft} more days.`, 'cat:' + g);
  }
  const up = pct(L.used, L.ceiling);
  if (up > 1.0000001) addAlert(`ceil100_${cid}`, 'crit', 'Monthly ceiling crossed', `You have spent ${inr(L.used)} against the ceiling of ${inr(L.ceiling)}. ${d.practice ? 'This is the practice month, so nothing is taken from next month.' : 'The extra will be taken from next month\'s limits unless other categories have money left at month end.'}`, 'home');
  else if (up >= 0.9) addAlert(`ceil90_${cid}`, 'warn', '90% of the monthly ceiling used', `${inr(L.left)} left for ${d.daysLeft} days.`, 'home');
  if (d.status === 'warn' && d.f <= 0.6 && d.paceUsed >= 0.5) addAlert(`pace_${cid}`, 'warn', 'Spending faster than usual', `${Math.round(d.paceUsed * 100)}% of everyday money is used and ${Math.round(d.f * 100)}% of the month has passed. About ${inr(Math.max(0, L.left) / d.daysLeft)} a day keeps you inside the ceiling.`, 'home');
  for (const b of set.bills || []) {
    const due = nextOccurrence(b.m, b.d, d.today, false), dd = diffDays(d.today, due);
    if (dd >= 0 && dd <= 30) {
      addAlert(`bill_${b.id}_${due}`, 'info', `${b.name} due ${fmtD(due)}`, `${inr(b.amt)} is due in ${dd} day${dd === 1 ? '' : 's'}. ${GMAP[b.g].n} has ${inr(L.cat[b.g].left)} available${L.cat[b.g].left >= b.amt ? ' — enough to pay it.' : `, short by ${inr(b.amt - L.cat[b.g].left)}.`}`, 'cat:' + b.g);
    }
  }
  if (!d.practice && !d.saveDone && (d.salaryIn || d.dayNo >= 3)) addAlert(`save_${cid}`, 'info', `Move this month's saving: ${inr(set.saving)}`, `Transfer ${inr(set.saving)} from your salary account today, then tap "I've done it" on the Home screen.`, 'savings');
  if (d.axisOwed > 0.5 && d.dayNo >= 20) addAlert(`axis_${cid}`, 'warn', `Axis card: ${inr(d.axisOwed)} to pay`, 'Pay the full Axis bill before the due date to avoid interest. Then record it with Add → Axis bill paid.', 'history');
  for (const e of d.entries) if (e.em && e.d >= set.startCycle.slice(0, 4) + '-01-01' && e.src === 'new') addAlert(`em_${e.id}`, 'warn', `Emergency fund used: ${inr(e.a)}`, `${e.emr || 'Emergency'} on ${fmtD(e.d)}. Next month's leftover money will refill the emergency fund first.`, 'savings');
  for (const m of d.moves) if (m.t === 'prepay') addAlert(`pre_${m.id}`, 'good', `Prepaid ${inr(m.amt)} on the home loan`, `Estimated interest saved so far: ${inrS(d.saved.saved)}. The loan should now end around ${fmtMY(d.saved.actEnd)}.`, 'savings');
}

  const m = Math.min(1, Math.max(0, d.markPos)), th = Math.PI * (1 - m);

  return `<div class="gauge" data-tour="track"><svg viewBox="0 0 260 150" role="img" aria-label="${Math.round(p * 100)} percent of the monthly ceiling spent. Today's mark is at ${Math.round(m * 100)} percent.">

    <line x1="${pt(R - 17).split(',')[0]}" y1="${pt(R - 17).split(',')[1]}" x2="${pt(R + 17).split(',')[0]}" y2="${pt(R + 17).split(',')[1]}" class="g-mark"/></svg>

SCREENS.alerts = () => {
  setHeader('Alerts', D.unread ? `${D.unread} unread` : 'All caught up', false);
  const all = Object.values(S.alerts).sort((a, b) => (a.t < b.t ? 1 : -1));
  const list = S.alertF === 'unread' ? all.filter(a => !a.read) : all;
  const now = Date.now(); const groups = { Today: [], 'This week': [], Earlier: [] };
  for (const a of list) { const age = (now - Date.parse(a.t)) / 864e5; (age < 1 && new Date(a.t).toDateString() === new Date().toDateString() ? groups.Today : age < 7 ? groups['This week'] : groups.Earlier).push(a); }
  const sevLbl = { crit: '✕ Limit crossed', warn: '! Needs attention', info: 'i For your info', good: '✓ Good news' };
  let h = `<div class="stack">${banners()}<div class="row"><div class="chips grow">${[['all', 'All'], ['unread', 'Unread']].map(([k, n]) => `<button class="chip" data-act="alertF" data-k="${k}" aria-pressed="${S.alertF === k}">${n}</button>`).join('')}</div>${D.unread ? '<button class="linkbtn" data-act="readAll">Mark all read</button>' : ''}</div>`;

function monthSeries(noLoans) {
  const tot = {}; for (const e of D.entries) if (e.k === 'e' && !(noLoans && e.g === 'loans')) tot[e.cy] = (tot[e.cy] || 0) + e.a;
  const out = []; let c = '2023-10'; while (c <= D.cur) { out.push({ c, v: tot[c] || 0 }); c = nextCycle(c); }
  return out;
}
function trendBlock() {
  const s = monthSeries(S.repNoLoans).slice(-24);
  const full = s.filter(x => x.c !== D.cur && x.v > 0); const avg = full.length ? full.reduce((a, x) => a + x.v, 0) / full.length : 0;
  const empty = s.filter(x => x.c !== D.cur && x.v === 0).map(x => cycName(x.c));
  const W = 340, H = 190, pl = 40, pr = 8, pt = 12, pb = 24, max = Math.max(...s.map(x => x.v), avg, 1);
  const step = niceStep(max / 4), top = Math.ceil(max / step) * step;
  const bw = (W - pl - pr) / s.length, y = v => pt + (H - pt - pb) * (1 - v / top);
  let g = '';
  for (let v = 0; v <= top + 1; v += step) g += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line2)"/><text x="${pl - 5}" y="${y(v) + 4}" text-anchor="end">${v ? trimz((v / 1e5).toFixed(1)) + 'L' : '0'}</text>`;
  s.forEach((x, i) => {

    g += `<rect x="${bx.toFixed(1)}" y="${y(x.v).toFixed(1)}" width="${(bw * 0.64).toFixed(1)}" height="${Math.max(0, bh).toFixed(1)}" rx="3" fill="${x.c === D.cur ? 'var(--marigold)' : 'var(--accent)'}"/>`;
    g += `<rect data-act="barTap" data-c="${x.c}" data-v="${Math.round(x.v)}" x="${(pl + i * bw).toFixed(1)}" y="${pt}" width="${bw.toFixed(1)}" height="${H - pt - pb}" fill="transparent" style="cursor:pointer"/>`;
    if ((s.length - 1 - i) % 3 === 0) g += `<text x="${(pl + i * bw + bw / 2).toFixed(1)}" y="${H - 7}" text-anchor="middle">${cycShort(x.c)}</text>`;
  });
  if (avg) g += `<line x1="${pl}" x2="${W - pr}" y1="${y(avg)}" y2="${y(avg)}" stroke="var(--ink)" stroke-dasharray="4 4" stroke-width="1.2"/><text x="${W - pr}" y="${y(avg) - 5}" text-anchor="end" style="fill:var(--ink);font-weight:700">avg ${inrS(avg)}</text>`;
  return `<div class="card chart stack" style="gap:8px"><div class="row"><h2 class="grow">Spending each month</h2></div>
   <div class="chips">${[[false, 'Everything'], [true, 'Without loan EMIs']].map(([k, n]) => `<button class="chip" data-act="repNL" data-k="${k}" aria-pressed="${S.repNoLoans === k}">${n}</button>`).join('')}</div>
   <div class="readout num" id="barRead">Tap a bar to see the amount.</div>
   <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Bar chart of monthly spending for the last ${s.length} months. Average ${inr(avg)}.">${g}</svg>
   <p class="tiny muted">Card bill payments, loans received and savings are not counted. The yellow bar is this month so far.${empty.length ? ' No entries were recorded in ' + esc(empty.join(', ')) + '.' : ''}</p></div>`;

function niceStep(x) { const p = Math.pow(10, Math.floor(Math.log10(Math.max(x, 1)))); const n = x / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }

  const end = D.cur; const cys = []; let c = prevCycle(end); while (cys.length < 12) { cys.push(c); c = prevCycle(c); }

function loanChart(bal, from, set) {
  const base = loanFuture(bal, from, set, 0, 0).series, plan = loanFuture(bal, from, set, +set.loanShare || 0, +set.extraPerYear || 0).series;

  g += `<path d="${path(base)}" fill="none" stroke="var(--faint)" stroke-width="2" stroke-dasharray="5 4"/><path d="${path(plan)}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>`;

  g += `<circle cx="${x(n - 1)}" cy="${y(0)}" r="5" fill="var(--faint)" stroke="var(--card)" stroke-width="2"/><text x="${x(n - 1)}" y="${y(0) - 9}" text-anchor="end">${base[n - 1].d.slice(0, 4)}</text>`;
  return `<div class="chart"><div class="row small" style="gap:16px;flex-wrap:wrap"><span><span style="color:var(--accent)">━</span> With the plan</span><span><span style="color:var(--faint)">╍</span> EMI only</span></div>
   <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Loan balance: with the plan it ends in ${plan[pe].d.slice(0, 4)}, with EMI only in ${base[n - 1].d.slice(0, 4)}.">${g}</svg></div>`;
}

function limTotal() {
  const el = $('#limTot'); if (!el) return;
  const set = D.set, tot = GKEYS.reduce((a, g) => a + parseAmt($('#lim_' + g).value), 0), ceil = set.income - set.saving, diff = ceil - tot;
  el.innerHTML = Math.abs(diff) < 0.5 ? `<span class="st-good">✓ Adds up to ${inr(tot)}</span>` : diff > 0 ? `<span class="st-warn">${inr(diff)} not given to any category</span>` : `<span class="st-crit">${inr(-diff)} more than the ceiling</span>`;
  $('#limSave').textContent = Math.abs(diff) < 0.5 ? 'Save' : 'Fix with Other / buffer';
}
async function saveLimits() {
  const set = D.set, ceil = set.income - set.saving, limits = {}, roll = {};
  for (const g of GKEYS) { limits[g] = parseAmt($('#lim_' + g).value); roll[g] = Number($('#rol_' + g).value) || 0; }
  const tot = GKEYS.reduce((a, g) => a + limits[g], 0), diff = ceil - tot;

// ---------- phone-app storage, backup, sharing
const isStandalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
let saveT = null, saveErr = false;
function persistStore(store) {
  clearTimeout(saveT);
  saveT = setTimeout(() => flushStore(store), 120);
}
function flushStore(store) {
  try { localStorage.setItem('mb_db', JSON.stringify([...store])); saveErr = false; }
  catch (e) { if (!saveErr) toast('Phone storage is full. Back up, then free some space.'); saveErr = true; }
}
function LocalDB() {
  let init = [];
  try { init = JSON.parse(localStorage.getItem('mb_db') || '[]'); } catch (e) { init = []; }
  const db = MemDB(init, persistStore);
  const flush = () => { clearTimeout(saveT); flushStore(db._store); };
  window.addEventListener('pagehide', flush); document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });
  return db;
}
const b64d = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4)), c => c.charCodeAt(0));
function hashKey() { const m = /[#&]k=([A-Za-z0-9_-]{16,})/.exec(location.hash || ''); return m ? m[1] : null; }
async function unlock(key) {
  try {
    const res = await fetch('data.enc', { cache: 'no-store' }); if (!res.ok) throw new Error('fetch');
    const j = await res.json();
    const k = await crypto.subtle.importKey('raw', b64d(key.trim()), 'AES-GCM', false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(j.iv) }, k, b64d(j.ct));
    const data = JSON.parse(new TextDecoder().decode(pt));
    localStorage.setItem('mb_hx', JSON.stringify(data.hx));
    let st = []; try { st = JSON.parse(localStorage.getItem('mb_db') || '[]'); } catch (e) { }
    if (!st.some(([p]) => p === 'app/settings')) st.push(['app/settings', data.settings]);
    localStorage.setItem('mb_db', JSON.stringify(st));
    if (!lsGet('mb_first')) lsSet('mb_first', todayStr());
    return true;
  } catch (e) { console.error('unlock', e); return false; }
}
function needBackup() {
  if (S.later.backup) return false;
  const last = lsGet('mb_lastBackup'), first = lsGet('mb_first') || todayStr();
  return last ? diffDays(last, todayStr()) >= 30 : diffDays(first, todayStr()) >= 2;
}
function backupBlob() {
  return new Blob([JSON.stringify({ app: 'family-money-book', v: 1, at: new Date().toISOString(), hx: S.hx, db: [...S.db._store] })], { type: 'application/json' });
}
async function saveFile(blob, name, title) {
  try {
    const file = new File([blob], name, { type: blob.type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title }); return true; }
  } catch (e) { if (e && e.name === 'AbortError') return false; }
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000); return true; } catch (e) { return false; }
}
async function doBackup() {
  const ok = await saveFile(backupBlob(), `money-book-backup-${todayStr()}.json`, 'Money book backup');
  if (ok) { lsSet('mb_lastBackup', todayStr()); toast('Backup saved'); render(); }
}
async function restoreFrom(input) {
  const f = input.files && input.files[0]; if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    if (j.app !== 'family-money-book' || !Array.isArray(j.hx) || !Array.isArray(j.db)) throw new Error('bad');
    localStorage.setItem('mb_hx', JSON.stringify(j.hx)); localStorage.setItem('mb_db', JSON.stringify(j.db));
    lsSet('mb_lastBackup', todayStr()); if (!lsGet('mb_first')) lsSet('mb_first', todayStr()); lsSet('mb_tour', '1');
    location.reload();
  } catch (e) { toast('That file is not a money book backup.'); }
}
async function shareText(text) {
  try { if (navigator.share) { await navigator.share({ text }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(text); toast('Copied. Paste it in WhatsApp.'); } catch (e) { toast('Could not share from here.'); }
}
function reportText(c) {
  const d = D, isCur = c === d.cur, R0 = isCur ? null : d.closes[c];
  const cat = isCur ? d.live.cat : R0.cat, ceiling = isCur ? d.live.ceiling : R0.ceiling, used = isCur ? d.live.used : R0.used;
  const over = GKEYS.filter(g => cat[g].spent > cat[g].avail + cat[g].pot + 0.5 && g !== 'loans').map(g => `${GMAP[g].n} (${inr(cat[g].spent - cat[g].avail - cat[g].pot)} over)`);
  return [`📒 Money book – ${cycName(c)}${isCur ? ' (so far)' : ''}`, `Spent ${inr(used)} of ${inr(ceiling)} · ${used > ceiling ? inr(used - ceiling) + ' over' : inr(ceiling - used) + ' left'}`,

    `Emergency fund: ${inr(d.pots.ef)}`, d.set.loan.balance > 0 ? `Home loan left: ${inrS(d.loan.bal)}` : ''].filter(Boolean).join('\n');
}

  alertF: b => { S.alertF = b.dataset.k; render(); },
  readAll: async () => { for (const a of Object.values(S.alerts)) if (!a.read) await write(() => S.db.collection('alerts').doc(a.id).update({ read: true })); toast('All marked as read'); },
  openAlert: b => { const a = S.alerts[b.dataset.id]; if (!a) return; if (!a.read) write(() => S.db.collection('alerts').doc(a.id).update({ read: true })); const [v, arg] = String(a.link || '').split(':'); if (v === 'cat') { go('home'); sheetCat(arg); } else if (v) go(v, arg); },
  repC: b => { S.repCycle = b.dataset.c; render(); },
  repNL: b => { S.repNoLoans = b.dataset.k === 'true'; render(); },
  barTap: b => { const el = $('#barRead'); if (el) el.textContent = `${cycName(b.dataset.c)}: ${inr(+b.dataset.v)}`; },
  sheet: b => { const s = b.dataset.s; ({ save: sheetSave, prepay: sheetPrepay, gold: sheetGold, treat: sheetTreat, potset: () => sheetPotSet(b.dataset.p), loan: sheetLoan, limits: sheetLimits, income: sheetIncome, reward: sheetReward, bill: () => sheetBill(b.dataset.id), move: () => sheetMove(b.dataset.to), goldcalc: sheetGoldCalc, settings: sheetSettings }[s] || (() => { }))(); },
  doMove: () => doMove(), saveLimits: () => saveLimits(), saveIncome: () => saveIncome(),
  rwSet: async b => { if (await saveSettings({ rewardPct: Number(b.dataset.n) })) { closeSheet(); toast('Saved'); } },
  saveBill: b => saveBill(b.dataset.id), delBill: b => delBill(b, b.dataset.id),
  doSave: () => doSave(), doPrepay: () => doPrepay(), doGold: () => doGold(), doTreat: () => doTreat(), doPotSet: b => doPotSet(b.dataset.p), saveLoan: () => saveLoan(),
  saveSettingsSheet: () => saveSettingsSheet(), csv: () => csv(),
  bigText: b => { const on = !document.documentElement.classList.contains('big'); document.documentElement.classList.toggle('big', on); lsSet('mb_big', on ? '1' : '0'); b.setAttribute('aria-checked', on); b.querySelector('.knob').style.background = on ? 'var(--accent)' : ''; },
  tour: () => startTour(), welcomeTour: () => startTour(), install: async () => { if (S.installEvt) { S.installEvt.prompt(); try { await S.installEvt.userChoice; } catch (e) { } S.installEvt = null; render(); } }, backup: () => doBackup(), shareRep: () => shareText(reportText(S.repCycle)),
  setupCode: async () => { const v = ($('#setupCode').value || '').trim().replace(/^.*[#&]k=/, ''); if (!v) return; showSetup('loading'); if (await unlock(v)) location.reload(); else showSetup('bad'); },
  restoreArm: b => { if (!b.classList.contains('armed')) { b.classList.add('armed'); b.textContent = 'This replaces the data on this phone. Tap again to choose the file'; return; } $('#restoreFile').click(); }, tourNext: () => { if (T.i >= TOUR.length - 1) endTour(); else { T.i++; renderTour(); } }, tourBack: () => { T.i = Math.max(0, T.i - 1); renderTour(); }, tourEnd: () => endTour(),
};
document.addEventListener('click', e => {
  const nav = e.target.closest('[data-nav]'); if (nav) { go(nav.dataset.nav); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const f = ACT[b.dataset.act]; if (!f) return;
  if (b.tagName === 'A') e.preventDefault();
  f(b);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'histQ') { S.histF.q = t.value; S.histN = 150; renderHistList(); }
  if (t.id === 'aDate') { t.dataset.touched = '1'; if (t.value) { A.d = t.value; document.querySelectorAll('[data-act="aD"]').forEach(x => x.setAttribute('aria-pressed', x.dataset.d === A.d)); } }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'restoreFile' || t.id === 'restoreFile2') restoreFrom(t);
  if (t.id === 'histG') { S.histF.g = t.value; S.histN = 150; renderHistList(); }
  if (t.id === 'histM') { S.histF.m = t.value; S.histN = 150; renderHistList(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (T) endTour(); else closeSheet(); }
  if (e.key === 'Enter' && e.target.id === 'aAmt') { e.preventDefault(); e.target.blur(); }
});
$('#helpBtn').addEventListener('click', sheetHelp);
$('#backBtn').addEventListener('click', () => go('more'));
$('#main').addEventListener('scroll', () => $('#top').classList.toggle('scrolled', $('#main').scrollTop > 4), { passive: true });
window.addEventListener('resize', () => { if (T) renderTour(); });

// ---------- boot
async function boot() {
  if (lsGet('mb_big') === '1') document.documentElement.classList.add('big');
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); S.installEvt = e; schedule(); });
  window.addEventListener('appinstalled', () => { S.installEvt = null; S.later.install = 1; schedule(); });
  if (PWA) {
    window.addEventListener('hashchange', () => { if (hashKey()) location.reload(); });
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { });
    const key = hashKey();
    if (key) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { } }
    let hx = lsGet('mb_hx');
    if (!hx && key) { showSetup('loading'); if (await unlock(key)) hx = lsGet('mb_hx'); else { showSetup('bad'); return; } }
    if (!hx) { showSetup('need'); return; }
    try { S.hx = JSON.parse(hx); } catch (e) { S.hx = []; }
    S.hxLoaded = true; S.db = LocalDB(); S.connecting = false; S.memMode = false;
    if (!lsGet('mb_first')) lsSet('mb_first', todayStr());
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }
    $('#tourRoot').innerHTML = '';
    S.animHome = true; startSubs(); schedule();
  } else {
    S.animHome = true; derive(); render();
    fetch('history.json').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(j => { S.hx = j; S.hxLoaded = true; USUAL = null; S.animHome = true; schedule(); }).catch(err => { console.error('history', err); S.hxLoaded = true; schedule(); });
    let db = null;
    try { if (window.claude && typeof window.claude.use === 'function') db = await window.claude.use('db'); } catch (e) { db = null; }
    if (!db) { S.memMode = true; db = MemDB(); }
    S.db = db; S.connecting = false;
    try { if (window.claude && typeof window.claude.use === 'function') S.downloads = await window.claude.use('downloads'); } catch (e) { }
    startSubs(); schedule();
  }
  const tourWait = setInterval(() => {
    if (!S.hxLoaded || (!allReady() && !S.memMode)) return;
    clearInterval(tourWait);
    if (lsGet('mb_tour') !== '1' && !(D && D.set.tourSeen) && !S.tourDone) setTimeout(showWelcome, 300);
  }, 300);
}
boot();
})();

</script>
